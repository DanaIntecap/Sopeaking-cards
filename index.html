<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Journey Speaking Cards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Montserrat',sans-serif;
    background:#0060AA;
    margin:0;
    padding:20px;
}

/* Contenedor principal recuperado */
.container {
    max-width: 950px;
    margin: auto;
    background: white; 
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,.15);
}

/* Área exclusiva para el Logo de INTECAP (Fondo Blanco) */
.logo-intecap {
    text-align: left; 
    margin-bottom: 20px;
    padding-bottom: 10px;
}

.logo-intecap img {
    max-height: 45px;
}

/* Recuadro Azul para English Journey */
.banner {
    text-align: center;
    background: #0060AA;
    color: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 25px;
}

.banner h1 {
    font-family: 'Antonio', sans-serif;
    font-size: 48px;
    margin: 5px 0;
}

.banner h2 {
    font-family: 'Poppins', sans-serif;
    font-size: 22px;
    font-weight: 500;
    margin: 0;
}

.logo-center img {
    max-height: 140px;
}

/* --- ESTILOS DEL ACORDEÓN DE INSTRUCCIONES --- */
details {
    background: #f5f7fa;
    border-radius: 15px;
    margin-bottom: 25px;
    border: 1px solid #d1d5db;
}

summary {
    padding: 15px 20px;
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #00205b;
    cursor: pointer;
    list-style: none; /* Quita la flecha por defecto en algunos navegadores */
    display: flex;
    align-items: center;
    justify-content: space-between;
}

summary::-webkit-details-marker {
    display: none; /* Quita la flecha en Chrome/Safari */
}

summary::after {
    content: '+';
    font-size: 24px;
    font-weight: normal;
    color: #0060AA;
    transition: transform 0.3s ease;
}

details[open] summary::after {
    content: '−';
}

.instructions-content {
    padding: 0 20px 20px 20px;
    color: #333;
    font-size: 15px;
    line-height: 1.6;
}

.instructions-content h3 {
    color: #00205b;
    margin-top: 20px;
    margin-bottom: 10px;
    font-size: 18px;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 5px;
}

.instructions-content h4 {
    color: #0060AA;
    margin-top: 15px;
    margin-bottom: 5px;
    font-family: 'Poppins', sans-serif;
}

.instructions-content ul {
    margin-top: 0;
    padding-left: 20px;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    margin-bottom: 15px;
    margin-top: 10px;
}

.info-grid div {
    display: flex;
    flex-direction: column;
}

.info-grid span.label {
    font-size: 12px;
    color: #6b7280;
    text-transform: uppercase;
    font-weight: bold;
}

.info-grid span.value {
    font-size: 16px;
    font-weight: 600;
    color: #00205b;
}
/* ------------------------------------------- */

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
    margin:20px 0;
}

select,button{
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

button{
    width:100%;
    margin-top:8px;
    cursor:pointer;
}

.btn-primary{
    background:#00205b;
    color:white;
}

.btn-listen{
    background:#ffed00;
    color:#00205b;
}

.card{
    margin-top:20px;
    background:#f5f7fa;
    padding:25px;
    border-radius:18px;
    text-align:center;
}

.badges{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.badge{
    color:white;
    padding:8px 14px;
    border-radius:20px;
}

.level{
    background:#00205b;
}

.unit{
    background:#008D36;
}

.topic{
    background:#ffed00;
    color:#00205b;
}

.question{
    font-size:32px;
    font-weight:bold;
    margin:25px 0;
}

.hint-box,
.answer-box{
    margin-top:15px;
    padding:15px;
    border-radius:10px;
}

.hint-box{
    background:#fff8d6;
}

.answer-box{
    background:#eaffea;
}

.hidden{
    display:none;
}

.counter{
    margin-top:20px;
    text-align:center;
}

</style>

</head>
<body>

<div class="container">

    <div class="logo-intecap">
        <img src="logo-intecap.png" alt="INTECAP">
    </div>

    <div class="banner">
        <div class="logo-center">
            <img src="ingles-para-todos.png" alt="English Journey">
        </div>
        <h1>ENGLISH JOURNEY</h1>
        <h2>Speaking Cards</h2>
    </div>

    <details>
        <summary>📖 Ficha Técnica de la Actividad</summary>
        <div class="instructions-content">
            
            <div class="info-grid">
                <div><span class="label">🏷️ Nombre</span><span class="value">Speaking Cards</span></div>
                <div><span class="label">🗣️ Skill</span><span class="value">Speaking</span></div>
                <div><span class="label">📈 Nivel</span><span class="value">A1.1</span></div>
                <div><span class="label">⏱️ Tiempo</span><span class="value">5 minutos</span></div>
            </div>

            <h3>📝 Descripción de la actividad</h3>
            <p>Actividad interactiva enfocada en el desarrollo ágil de la flu
